version: "3.9"

services:
  traefik:
    image: docker.io/traefik:v3.7
    container_name: traefik
    restart: unless-stopped

    networks:
      - proxy

    ports:
      - "192.168.1.181:80:80"
      - "192.168.1.181:443:443"

    env_file:
      - ./cf.env

    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./dynamic:/dynamic:ro
      - ./certs:/certs:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.az-lab.dev`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=le"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.middlewares.traefik-allow.ipallowlist.sourcerange=192.168.1.0/24,192.168.99.0/24,10.7.0.0/24,10.89.0.0/16"
      - "traefik.http.routers.traefik.middlewares=traefik-allow,authelia-auth@file,strip-www-auth@file"

    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--api.dashboard=true"

      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.metrics.address=:8082"

      # GHSA-rf44-j88r-hh8c (v3.7.12): backends (PHP/CGI/WSGI/nginx) collapse
      # X_Auth_User / X.Auth.User into the same var as X-Auth-User, letting a
      # client smuggle an alias past authelia forward-auth and spoof identity.
      # Default "keep" stays vulnerable — must be delete or reject.
      - "--entrypoints.web.http.aliasheadersstrategy=delete"
      - "--entrypoints.websecure.http.aliasheadersstrategy=delete"
      - "--entrypoints.metrics.http.aliasheadersstrategy=delete"

      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.entryPoint=metrics"

      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"

      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"

      - "--certificatesresolvers.le.acme.email=almty1@gmail.com"
      - "--certificatesresolvers.le.acme.storage=/data/acme.json"
      - "--certificatesresolvers.le.acme.dnschallenge=true"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le.acme.dnschallenge.propagation.delaybeforechecks=30"
      - "--certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"

networks:
  proxy:
    external: true
