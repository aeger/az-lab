http:
  routers:
    amp-public:
      rule: "Host(`games.az-lab.dev`)"
      service: amp-service
      entryPoints:
        - websecure
      middlewares:
        - authelia-auth@file
        - strip-www-auth@file
      tls:
        certResolver: le

  services:
    amp-service:
      loadBalancer:
        servers:
          # AMP moved to LXC 106 on VLAN30; 192.168.1.130 was stale and caused 504s.
          - url: "http://192.168.30.10:8080"
