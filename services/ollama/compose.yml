services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  ollama:
    external: true
