server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Directory listing so you can eyeball what's published
    autoindex on;

    # Never cache the manifest of truth — desktop poller must see new hashes immediately
    location = /lumen-dist.zip.sha256 {
        add_header Cache-Control "no-store";
        default_type text/plain;
    }
    location = /version.txt {
        add_header Cache-Control "no-store";
        default_type text/plain;
    }

    location = /lumen-dist.zip {
        add_header Cache-Control "no-store";
        types { } default_type application/zip;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
