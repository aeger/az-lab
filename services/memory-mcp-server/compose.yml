name: az-lab-memory-mcp

services:
  # ─── Memory MCP Server ──────────────────────────────────────────────────────
  memory-mcp:
    image: az-memory-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: az-memory-mcp
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - PORT=3100
      - OLLAMA_URL=http://ollama:11434
      - EMBED_MODEL=nomic-embed-text
      # Embedding backend selector (2026-07-24 research rec 1 — kill the Ollama
      # silent-wedge failure mode from 2026-07-15). Default 'ollama' keeps current
      # behaviour; flip to 'tei' ONLY after the gated cutover in
      # docs/EMBEDDING_TEI_MIGRATION.md (needs a full corpus re-embed + a green
      # retrieval_regression.py run). TEI has a real /health readiness gate, so a
      # wedge surfaces instead of silently attaching stale/NULL embeddings for 38h.
      - EMBED_BACKEND=${EMBED_BACKEND:-ollama}
      - TEI_EMBED_URL=${TEI_EMBED_URL:-http://tei-embed:8081}
      # Mem0 LLM classification (optional — heuristic mode if unset)
      # Set to NemoClaw NIM API for LLM-based ADD/UPDATE/DELETE/NOOP decisions
      - LLM_URL=${LLM_URL:-}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
      # TEI cross-encoder reranking (primary — local, fast, ~80ms)
      # bge-reranker-v2-m3 served by tei-reranker container below
      - RERANKER_URL=http://tei-reranker:8080
      # Nemotron reranking (fallback when TEI unavailable — skipped if NVIDIA_API_KEY unset)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - RERANK_URL=${RERANK_URL:-http://192.168.1.183:8000}
      - RERANK_MODEL=${RERANK_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      - RERANK_TOP_K=${RERANK_TOP_K:-5}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      # AIP: Agent Identity Protocol — shared HS256 secret for caller-identity JWTs
      # Agents sign: {"sub":"wren","iss":"az-lab","iat":<unix>,"exp":<unix+3600>}
      # If unset, AIP verification is disabled (backward-compatible)
      - AIP_SECRET=${AIP_SECRET:-}
    depends_on:
      tei-reranker:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory-mcp.rule=Host(`memory-mcp.az-lab.dev`)"
      - "traefik.http.routers.memory-mcp.entrypoints=websecure"
      - "traefik.http.routers.memory-mcp.tls=true"
      - "traefik.http.routers.memory-mcp.tls.certresolver=le"
      - "traefik.http.routers.memory-mcp.middlewares=lan-allow@file"
      - "traefik.http.services.memory-mcp.loadbalancer.server.port=3100"

  # ─── TEI Cross-Encoder Reranker ─────────────────────────────────────────────
  # bge-reranker-base: lightweight cross-encoder, ~330MB, CPU-only, ~100ms latency
  # v2-m3 lacks ONNX files on HF → switched to -base with verified ONNX support
  # First start downloads model from HuggingFace into tei-model-cache volume
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: az-tei-reranker
    restart: unless-stopped
    command: --model-id BAAI/bge-reranker-base --port 8080
    volumes:
      - tei-model-cache:/data
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ─── TEI Embedding server (2026-07-24 research rec 1) ────────────────────────
  # Serves nomic-embed-text-v1.5 (768d — DIMENSION-IDENTICAL to the current Ollama
  # nomic-embed-text and the vector(768) column, so no pgvector schema change).
  # Purpose: replace the Ollama embed dependency, whose container silently wedged
  # ~38h on 2026-07-15 (podman ps "Up" while every embed failed). TEI exposes a real
  # /health readiness gate, so a wedge is detectable instead of silently degrading.
  #
  # DEPLOYED-BUT-DORMANT: nothing reads this until memory-mcp's EMBED_BACKEND=tei.
  # That flip requires the gated cutover in docs/EMBEDDING_TEI_MIGRATION.md (full
  # corpus re-embed + prefix parity + a green retrieval_regression.py run) — do NOT
  # flip it here. Starting this container early just warms the model cache.
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: az-tei-embed
    restart: unless-stopped
    command: --model-id nomic-ai/nomic-embed-text-v1.5 --port 8081
    volumes:
      - tei-embed-cache:/data
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  tei-model-cache:
  tei-embed-cache:

networks:
  proxy:
    external: true
