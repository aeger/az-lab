name: az-lab-gmail-mcp

services:
  # ─── Gmail MCP Server ────────────────────────────────────────────────────────
  gmail-mcp:
    image: az-gmail-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: az-gmail-mcp
    restart: unless-stopped
    environment:
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
      - GMAIL_SEND_ALLOWLIST=${GMAIL_SEND_ALLOWLIST:-daily-email-triage}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-az-lab-cdn}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - PORT=3000
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - GMAIL_AUTH_BASE=https://gmail-mcp.az-lab.dev
      - GMAIL_ENV_PATH=/app/gmail-mcp.env
    volumes:
      # The /auth flow rewrites GMAIL_REFRESH_TOKEN in this file. The container runs
      # as uid 1001 / gid 65533, so the host file MUST be group-writable by the mapped
      # subgid or the write fails silently and the new token lives only in memory:
      #   podman unshare chgrp 65533 .env && podman unshare chmod 660 .env
      # (host: -rw-rw---- almty1:165532). NOTE: `sed -i` on .env recreates the file and
      # resets the group — re-run the chgrp after any host-side edit.
      - /home/almty1/azlab/services/gmail-mcp-server/.env:/app/gmail-mcp.env:rw
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gmail-mcp.rule=Host(`gmail-mcp.az-lab.dev`)"
      - "traefik.http.routers.gmail-mcp.entrypoints=websecure"
      - "traefik.http.routers.gmail-mcp.tls=true"
      - "traefik.http.routers.gmail-mcp.tls.certresolver=le"
      - "traefik.http.routers.gmail-mcp.middlewares=lan-allow@file"
      - "traefik.http.services.gmail-mcp.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
