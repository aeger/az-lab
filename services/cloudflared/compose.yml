name: az-lab-cloudflared

# Cloudflare Tunnel connector for grimoire.az-lab.dev.
# Remotely-managed tunnel "grimoire" (id 8a35d40c-82de-4c8a-98f8-012fc9989bb8);
# ingress is configured via the CF API/dashboard, routing grimoire.az-lab.dev ->
# http://az-grimoire:3000 (same 'proxy' podman network). No inbound ports opened.
services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: az-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - proxy

networks:
  proxy:
    external: true
